<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thayssa Veículos | Curadoria Automotiva Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,700;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,600;1,9..40,400&family=Playfair+Display:ital,wght@0,700;1,700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
      :root {
        --off-white: #F5F4F0;
        --white: #FFFFFF;
        --texto: #1A1A1A;
        --vinho: #C41E1E;
        --dourado-terroso: #8B7355;
        --divisores: #E5E0D8;
        --dark: #1A1A1A;
      }
      
      body {
        background-color: var(--off-white);
        color: var(--texto);
        -webkit-font-smoothing: antialiased;
      }

      .scroll-reveal {
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 0.7s ease, transform 0.7s ease;
      }

      .scroll-reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
